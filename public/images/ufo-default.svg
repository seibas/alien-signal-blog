<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Light beam -->
  <defs>
    <linearGradient id="beam" x1="100" y1="110" x2="100" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="metal" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#9AA5B0"/>
      <stop offset="100%" stop-color="#5A6173"/>
    </radialGradient>
    <radialGradient id="glass" cx="0.5" cy="0.3">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00CCFF" stop-opacity="0.5"/>
    </radialGradient>
  </defs>
  
  <!-- Light beam trapezoid -->
  <path d="M 70 110 L 50 190 L 150 190 L 130 110 Z" fill="url(#beam)"/>
  
  <!-- UFO bottom rim -->
  <ellipse cx="100" cy="110" rx="60" ry="16" fill="#1A1F2E"/>
  <ellipse cx="100" cy="110" rx="60" ry="16" fill="#00FF41" opacity="0.3"/>
  
  <!-- UFO main body -->
  <ellipse cx="100" cy="90" rx="70" ry="24" fill="url(#metal)"/>
  
  <!-- UFO top dome -->
  <circle cx="100" cy="70" r="30" fill="url(#glass)"/>
  
  <!-- Lights around UFO -->
  <circle cx="60" cy="96" r="4" fill="#FF6B35">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="100" r="4" fill="#00FF41">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="102" r="4" fill="#FF6B35">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="100" r="4" fill="#00FF41">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="96" r="4" fill="#FF6B35">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner dome highlight -->
  <circle cx="90" cy="65" r="8" fill="#FFFFFF" opacity="0.6"/>
</svg>
